<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../book.ico" type="image/x-icon" />

    <title>Lista De Leituras</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #1552ac;
      }

      .table-wrapper {
        border-radius: 15px;
        overflow: hidden;
      }

      .capa-img {
        width: 90px;
        height: 110px;
        object-fit: cover;
        border-radius: 6px;
      }

      a {
        color: white;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <!-- py-5 em vez de mt-5 para dar um espaçamento superior e inferior mais equilibrado -->
    <div class="container py-5">
      <!-- Cabeçalho Flexível com Título e Botão de Ação -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 fw-bold text-light">
          <i class="bi bi-journal-bookmark-fill text-light me-2"></i>Obras
        </h2>
        <a href="../inserir/index.html" class="text-decoration-none">
          <button class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="bi bi-plus-lg me-1"></i>
            Nova Obra
          </button>
        </a>
      </div>

      <!-- Card envolvendo a tabela -->
      <div class="card border-0 shadow-sm table-wrapper">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th class="ps-4 text-secondary fw-semibold border-bottom-0">
                    Capa
                  </th>
                  <th class="text-secondary fw-semibold border-bottom-0">
                    Título
                  </th>
                  <th class="text-secondary fw-semibold border-bottom-0">
                    Editora
                  </th>
                  <th class="text-secondary fw-semibold border-bottom-0">
                    Status
                  </th>
                  <th class="text-secondary fw-semibold border-bottom-0">
                    Açoes
                  </th>
                </tr>
              </thead>

              <tbody id="tabela-obras"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
