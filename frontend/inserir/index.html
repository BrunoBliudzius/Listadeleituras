<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lista De Leituras</title>

    <link rel="icon" href="../book.ico" type="image/x-icon" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      /* Fundo seguindo o padrão da lista */
      body {
        background-color: #1552ac;
      }

      /* Foco nos inputs para combinar com a cor primária */
      .form-control:focus,
      .form-select:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(22, 44, 78, 0.25);
      }

      i {
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <!-- Link para voltar à lista -->
      <div class="mb-4 mx-auto" style="max-width: 600px">
        <a
          href="../pesquisar/index.html"
          class="text-decoration-none text-light"
        >
          <i class="bi bi-arrow-left me-1"></i> Voltar para a lista
        </a>
      </div>

      <!-- Card do Formulário -->
      <div class="card border-0 shadow-sm mx-auto" style="max-width: 600px">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">
              <i class="bi bi-plus-circle-fill text-primary me-2"></i>Adicionar
              Obra
            </h2>
            <p class="text-muted">
              Preencha os dados abaixo para registrar uma nova leitura.
            </p>
          </div>

          <!-- Adicionado enctype para garantir o envio correto da imagem -->
          <form id="form-obra" method="post" enctype="multipart/form-data">
            <!-- Campo Título -->
            <div class="mb-3">
              <label for="titulo" class="form-label fw-semibold"
                >Título <span class="text-danger">*</span></label
              >
              <div class="input-group shadow-sm">
                <span
                  class="input-group-text bg-light text-secondary border-end-0"
                  ><i class="bi bi-book text-dark"></i
                ></span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="titulo"
                  name="titulo"
                  placeholder="Ex: Harry Potter e a Pedra Filosofal"
                  required
                />
              </div>
            </div>

            <!-- Campo Editora -->
            <div class="mb-3">
              <label for="editora" class="form-label fw-semibold"
                >Editora</label
              >
              <div class="input-group shadow-sm">
                <span
                  class="input-group-text bg-light text-secondary border-end-0"
                  ><i class="bi bi-building text-dark"></i
                ></span>
                <input
                  type="text"
                  class="form-control border-start-0 ps-0"
                  id="editora"
                  name="editora"
                  placeholder="Opcional"
                />
              </div>
            </div>

            <!-- Campo Status -->
            <div class="mb-3">
              <label for="status" class="form-label fw-semibold"
                >Status <span class="text-danger">*</span></label
              >
              <div class="input-group shadow-sm">
                <span
                  class="input-group-text bg-light text-secondary border-end-0"
                  ><i class="bi bi-bookmark-star text-dark"></i
                ></span>
                <select
                  class="form-select border-start-0 ps-0"
                  id="status"
                  name="status"
                >
                  <option value="Lendo">Lendo</option>
                  <option value="Quero Ler" selected>Quero Ler</option>
                  <option value="Concluido">Concluído</option>
                </select>
              </div>
            </div>

            <!-- Campo Capa -->
            <div class="mb-4">
              <label for="capa" class="form-label fw-semibold"
                >Capa da Obra</label
              >
              <input
                class="form-control shadow-sm"
                type="file"
                id="capa"
                name="capa"
                accept="image/*"
              />
              <div class="form-text">
                <i class="bi bi-info-circle me-1 text-dark"></i>Envie uma imagem
                nos formatos JPG, PNG ou WEBP.
              </div>
            </div>

            <!-- Botão Submit -->
            <button
              type="submit"
              class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm mt-2"
            >
              <i class="bi bi-check2-circle me-2"></i>Salvar Obra
            </button>

            <!-- Local da mensagem de resposta (será manipulado pelo JS) -->
            <div class="mt-4 text-center">
              <h5 id="res" class="mb-0"></h5>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
